<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AuraX — Painel do Gestor</title>
<style>
  :root {
    --bg-1: #1a2338;
    --bg-2: #0b0c10;
    --bg-3: #08080a;
    --text: #eee;
    --text-muted: #9aa0ab;
    --text-dim: #6b7280;
    --accent-blue: #4f8cff;
    --accent-green: #7ee787;
    --accent-teal: #3ddba0;
    --accent-amber: #ffb648;
    --accent-red: #e5533d;
    --card-bg: linear-gradient(160deg, rgba(79, 140, 255, 0.07), rgba(126, 231, 135, 0.025));
    --card-border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse 1200px 800px at 50% -10%, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79, 140, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79, 140, 255, 0.045) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 75%);
    mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 75%);
    pointer-events: none;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; position: relative; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
  .top-bar-nav { display: flex; gap: 10px; flex-wrap: wrap; }
  .logo {
    font-size: 1.15rem; font-weight: 700; letter-spacing: 1.5px;
    background: linear-gradient(90deg, #eaf2ff, var(--accent-green) 55%, var(--accent-blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    font-weight: 600;
  }
  .btn {
    padding: 10px 20px;
    font-size: 0.85rem;
    background: linear-gradient(135deg, var(--accent-blue), #3d6fd6);
    color: white;
  }
  .btn.ghost {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-muted);
    border: 1px solid var(--card-border);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .panel-head { margin-bottom: 22px; }
  .panel-eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent-blue); margin-bottom: 6px; }
  .panel-head h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .panel-head p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }

  .add-row { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 18px; margin-bottom: 22px; }
  .add-row input[type="email"] {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 0.88rem;
    font-family: inherit;
  }
  .add-row input:focus { outline: none; border-color: var(--accent-blue); }
  .add-feedback { font-size: 0.8rem; margin-top: 10px; padding: 0 18px 4px; }
  .add-feedback.error { color: #ff8a76; }
  .add-feedback.success { color: var(--accent-green); }

  .team-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .person-card { padding: 14px 16px; }
  .person-top { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700; color: #0a0a0a;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
    flex-shrink: 0;
  }
  .person-name { font-weight: 600; font-size: 0.92rem; }
  .person-email { font-size: 0.72rem; color: var(--text-dim); }
  .person-footer {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--card-border);
    display: flex;
    justify-content: flex-end;
  }
  .remove-btn {
    background: none;
    color: var(--accent-red);
    font-size: 0.75rem;
    padding: 4px 10px;
  }
  .remove-btn:hover { background: rgba(229, 83, 61, 0.12); }

  .empty-state { padding: 30px 18px; text-align: center; color: var(--text-dim); font-size: 0.88rem; }

  .placeholder-card { padding: 18px 20px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }
  .placeholder-card b { color: var(--text); }

  .section-title { font-size: 0.95rem; margin: 0 0 12px; color: #dcdfe4; }

  .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-tabs button {
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-muted);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
  }
  .filter-tabs button.active {
    border-color: var(--accent-blue);
    background: rgba(79, 140, 255, 0.14);
    color: #fff;
  }

  .session-card { padding: 14px 16px; margin-bottom: 10px; }
  .session-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .session-title-row { display: flex; align-items: center; gap: 8px; }
  .session-title { font-weight: 600; font-size: 0.9rem; }
  .session-meta { font-size: 0.75rem; color: var(--text-dim); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge { font-size: 0.7rem; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .badge-focused { background: rgba(61, 219, 160, 0.15); color: var(--accent-teal); border: 1px solid rgba(61, 219, 160, 0.4); }
  .badge-motivated { background: rgba(255, 182, 72, 0.15); color: var(--accent-amber); border: 1px solid rgba(255, 182, 72, 0.4); }
  .badge-tired { background: rgba(79, 140, 255, 0.15); color: #7ba9ff; border: 1px solid rgba(79, 140, 255, 0.4); }
  .tip-line { font-size: 0.8rem; margin: 8px 0 0; padding-left: 9px; border-left: 2px solid var(--accent-amber); color: #ddd; }
  .tip-line.positive { border-left-color: var(--accent-green); }

  .rank-badge {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 800;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-muted);
    border: 1px solid var(--card-border);
  }
  .rank-badge.gold { background: rgba(255, 215, 0, 0.14); color: #ffd700; border-color: rgba(255, 215, 0, 0.4); }
  .rank-badge.silver { background: rgba(192, 192, 192, 0.14); color: #d6d6d6; border-color: rgba(192, 192, 192, 0.4); }
  .rank-badge.bronze { background: rgba(205, 127, 50, 0.16); color: #e0995e; border-color: rgba(205, 127, 50, 0.45); }
  .oratoria-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 999px;
    border: 1px solid;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat-card { padding: 14px 16px; text-align: center; }
  .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--accent-green); }
  .stat-label { font-size: 0.68rem; color: var(--text-dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }

  .focus-card {
    margin-bottom: 22px;
    padding: 18px 20px;
    background: linear-gradient(160deg, rgba(255, 182, 72, 0.1), rgba(255, 182, 72, 0.02));
    border-color: rgba(255, 182, 72, 0.3);
  }
  .focus-eyebrow { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent-amber); margin-bottom: 6px; }
  .focus-card h3 { font-size: 1.05rem; margin: 0 0 4px; color: #f5f5f5; }
  .focus-card p { margin: 0; color: var(--text-muted); font-size: 0.82rem; }

  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #gate p { color: var(--text-muted); font-size: 0.9rem; }

  [hidden] { display: none !important; }
</style>

<body>
  <div id="gate"><p>Carregando...</p></div>

  <div class="wrap" id="app" hidden>
    <div class="top-bar">
      <span class="logo">AuraX</span>
      <div class="top-bar-nav">
        <button type="button" class="btn ghost" id="howItWorksBtn">Como funciona</button>
        <button type="button" class="btn ghost" id="insightsBtn">Meus Insights</button>
        <button type="button" class="btn ghost" id="sessionsBtn">Minhas Sessões</button>
        <a class="btn ghost" href="index.html" style="text-decoration:none; display:inline-block;">Meu AuraX</a>
        <button type="button" class="btn ghost" id="logoutBtn">Sair</button>
      </div>
    </div>

    <div class="panel-head">
      <div class="panel-eyebrow">Painel do gestor</div>
      <h1 id="greeting">Olá</h1>
      <p id="greetingRole" style="display:none"></p>
      <p>Gerencie quem faz parte do seu time no AuraX.</p>
    </div>

    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-value" id="statTeamSessions">0</div><div class="stat-label">Sessões do time</div></div>
      <div class="card stat-card"><div class="stat-value" id="statTeamOratoria">—</div><div class="stat-label">Oratória média do time</div></div>
    </div>

    <div class="card focus-card" id="teamFocusCard" hidden>
      <div class="focus-eyebrow">Analisando o time</div>
      <h3 id="teamFocusTitle"></h3>
      <p id="teamFocusFrequency"></p>
    </div>

    <div class="card add-row">
      <input type="email" id="addEmailInput" placeholder="e-mail da pessoa que já tem conta no AuraX" />
      <button type="button" class="btn" id="addBtn">Adicionar ao time</button>
    </div>
    <div class="add-feedback" id="addFeedback"></div>

    <div class="section-title">Seu time</div>
    <div class="team-strip" id="teamStrip"></div>

    <div class="section-title">Sessões</div>
    <div class="filter-tabs" id="filterTabs"></div>
    <div id="sessionsList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = "https://tpjdogzhwandxwpwafzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LfW7G2Ai3G2_1Uj_MBRCfg_QIztRQNd";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUserId = null;
    let teamMembers = []; // [{ id, name }]
    let selectedFilter = "todos";

    function formatDateBR(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }

    function formatDurationShort(totalSeconds) {
      const s = Math.round(totalSeconds || 0);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}m ${String(r).padStart(2, "0")}s`;
    }

    function initials(name) {
      if (!name) return "?";
      return name.trim().split(/\s+/).slice(0, 2).map((p) => p[0].toUpperCase()).join("");
    }

    function average(arr) {
      if (!arr.length) return 0;
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }

    const ORATORIA_RANK_TIERS = [
      { min: 90, label: "Excelente", color: "#7ee787" },
      { min: 70, label: "Bom", color: "#7ee787" },
      { min: 50, label: "Médio", color: "#ffb648" },
      { min: 0, label: "Precisa de atenção", color: "#ff6b5b" },
    ];

    function oratoriaScoreRank(score) {
      return ORATORIA_RANK_TIERS.find((tier) => score >= tier.min);
    }

    function rankBadgeClass(position) {
      if (position === 0) return "gold";
      if (position === 1) return "silver";
      if (position === 2) return "bronze";
      return "";
    }

    const TIP_KEY_LABELS = {
      ritmo_acelerado: "Ritmo de fala acelerado",
      ritmo_tranquilo: "Ritmo de fala tranquilo",
      muitas_pausas: "Muitas pausas longas",
      escuta_ativa_pausas: "Escuta ativa (pausas longas)",
      dominou_conversa: "Dominou a conversa",
      boa_escuta: "Boa escuta ativa",
      silencio_alto: "Silêncio acima do ideal",
      muitas_girias: "Muitas gírias/informalidades",
      muitos_vicios: "Muitos vícios de linguagem",
      poucos_vicios: "Poucos vícios de linguagem",
      objecao_segura: "Boa recuperação em objeções",
      objecao_tensa: "Tensão ao responder objeções",
      poucas_perguntas_abertas: "Poucas perguntas abertas",
      boas_perguntas_abertas: "Boa proporção de perguntas abertas",
      cansaco: "Sinais de cansaço",
      boa_energia: "Boa energia/motivação",
      equilibrada: "Sessão equilibrada",
    };

    function personCardHtml(person) {
      return `
        <div class="card person-card" data-id="${person.id}">
          <div class="person-top">
            <span class="avatar">${initials(person.name)}</span>
            <div>
              <div class="person-name">${person.name || "(sem nome)"}</div>
              <div class="person-email">${person.cargo ? person.cargo + " · " : ""}${person.email || ""}</div>
            </div>
          </div>
          <div class="person-footer">
            <button type="button" class="remove-btn" data-remove="${person.id}">Remover do time</button>
          </div>
        </div>`;
    }

    async function loadTeam() {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("id, name, email, cargo")
        .eq("manager_id", currentUserId)
        .order("name");

      const teamStrip = document.getElementById("teamStrip");
      if (error) {
        teamStrip.innerHTML = `<div class="empty-state">Não foi possível carregar o time agora.</div>`;
        teamMembers = [];
      } else if (!data.length) {
        teamStrip.innerHTML = `<div class="empty-state">Nenhum funcionário no time ainda. Adicione pelo e-mail acima.</div>`;
        teamMembers = [];
      } else {
        teamStrip.innerHTML = data.map(personCardHtml).join("");
        teamStrip.querySelectorAll("[data-remove]").forEach((btn) => {
          btn.addEventListener("click", () => removeFromTeam(btn.dataset.remove));
        });
        teamMembers = data.map((p) => ({ id: p.id, name: p.name }));
      }

      renderFilterTabs();
      await renderTeamSummary();
      await renderSessions();
    }

    // Visão agregada do time inteiro (você + liderados), independente do
    // filtro selecionado abaixo — é o resumo "sempre visível" no topo.
    async function renderTeamSummary() {
      const allPeople = [{ id: currentUserId, name: "Você" }].concat(teamMembers);
      const targetIds = allPeople.map((p) => p.id);

      const { data, error } = await supabaseClient
        .from("sessions")
        .select("oratoria_score, tips")
        .in("user_id", targetIds);

      if (error || !data) return;

      document.getElementById("statTeamSessions").textContent = data.length;

      const scored = data.filter((s) => s.oratoria_score != null);
      document.getElementById("statTeamOratoria").textContent = scored.length
        ? Math.round(average(scored.map((s) => s.oratoria_score)))
        : "—";

      const tipCounts = {};
      data.forEach((s) => {
        (s.tips || []).forEach((t) => {
          if (!t || !t.key) return;
          if (!tipCounts[t.key]) tipCounts[t.key] = { type: t.type, count: 0 };
          tipCounts[t.key].count += 1;
        });
      });
      const rankedTips = Object.entries(tipCounts).sort((a, b) => b[1].count - a[1].count);
      const topImprovement = rankedTips.find(([, info]) => info.type === "melhorar");
      const focusCardEl = document.getElementById("teamFocusCard");
      if (topImprovement && data.length) {
        const [key, info] = topImprovement;
        const label = TIP_KEY_LABELS[key] || key;
        const pct = Math.round((info.count / data.length) * 100);
        focusCardEl.hidden = false;
        document.getElementById("teamFocusTitle").textContent = `Principal ponto de melhoria do time: ${label}`;
        document.getElementById("teamFocusFrequency").textContent = `Apareceu em ${info.count} de ${data.length} sessões do time (${pct}%).`;
      } else {
        focusCardEl.hidden = true;
      }
    }

    function renderFilterTabs() {
      const tabsEl = document.getElementById("filterTabs");
      const tabs = [{ id: "todos", label: "Toda a equipe" }, { id: currentUserId, label: "Você" }].concat(
        teamMembers.map((m) => ({ id: m.id, label: m.name }))
      );
      tabsEl.innerHTML = tabs
        .map((t) => `<button type="button" data-filter="${t.id}" class="${t.id === selectedFilter ? "active" : ""}">${t.label}</button>`)
        .join("");
      tabsEl.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedFilter = btn.dataset.filter;
          renderFilterTabs();
          renderSessions();
        });
      });
    }

    function sessionCardHtml(personName, row, position) {
      const tips = (row.tips || []).slice(0, 2);
      const tipsHtml = tips
        .map(
          (t) =>
            `<div class="tip-line ${t.type === "positivo" ? "positive" : ""}">${t.type === "positivo" ? "✓" : "→"} ${t.text}</div>`
        )
        .join("");
      const rank = row.oratoria_score != null ? oratoriaScoreRank(row.oratoria_score) : null;
      const oratoriaHtml = rank
        ? `<span class="oratoria-pill" style="color:${rank.color}; border-color:${rank.color}">${row.oratoria_score} · ${rank.label}</span>`
        : `<span class="oratoria-pill" style="color:#777; border-color:#444">Sem nota</span>`;
      const rankBadgeHtml = typeof position === "number"
        ? `<span class="rank-badge ${rankBadgeClass(position)}">#${position + 1}</span>`
        : "";
      return `
        <div class="card session-card">
          <div class="session-head">
            <div class="session-title-row">
              ${rankBadgeHtml}
              <div>
                <div class="session-title">${personName}${row.client_name ? " — Cliente: " + row.client_name : ""}</div>
                <div class="session-meta">${formatDateBR(row.date)} · ${formatDurationShort(row.duration)}</div>
              </div>
            </div>
            ${oratoriaHtml}
          </div>
          <div class="badges">
            <span class="badge badge-focused">Constância ${Math.round((row.focused || 0) * 100)}%</span>
            <span class="badge badge-motivated">Motivado ${Math.round((row.motivated || 0) * 100)}%</span>
            <span class="badge badge-tired">Cansado ${Math.round((row.tired || 0) * 100)}%</span>
          </div>
          ${tipsHtml}
        </div>`;
    }

    async function renderSessions() {
      const listEl = document.getElementById("sessionsList");
      const allPeople = [{ id: currentUserId, name: "Você" }].concat(teamMembers);
      const targetIds = selectedFilter === "todos" ? allPeople.map((p) => p.id) : [selectedFilter];

      const { data, error } = await supabaseClient
        .from("sessions")
        .select("*")
        .in("user_id", targetIds)
        .order("date", { ascending: false })
        .limit(30);

      if (error) {
        listEl.innerHTML = `<div class="empty-state">Não foi possível carregar as sessões agora.</div>`;
        return;
      }
      if (!data.length) {
        listEl.innerHTML = `<div class="empty-state">Nenhuma sessão registrada ainda.</div>`;
        return;
      }

      const nameById = {};
      allPeople.forEach((p) => { nameById[p.id] = p.name; });

      // Ranking: quem tem nota de oratória vem primeiro, do maior pro menor;
      // sessões sem nota (antes da métrica existir) ficam no fim, por data.
      const ranked = [...data].sort((a, b) => {
        if (a.oratoria_score == null && b.oratoria_score == null) return new Date(b.date) - new Date(a.date);
        if (a.oratoria_score == null) return 1;
        if (b.oratoria_score == null) return -1;
        return b.oratoria_score - a.oratoria_score;
      });

      listEl.innerHTML = ranked
        .map((row, i) => sessionCardHtml(nameById[row.user_id] || "Alguém do time", row, i))
        .join("");
    }

    function showFeedback(text, type) {
      const el = document.getElementById("addFeedback");
      el.textContent = text;
      el.className = `add-feedback ${type}`;
    }

    async function addToTeam() {
      const input = document.getElementById("addEmailInput");
      const email = input.value.trim();
      if (!email) return;

      const addBtn = document.getElementById("addBtn");
      addBtn.disabled = true;
      showFeedback("", "");

      try {
        const { data: found, error: findError } = await supabaseClient
          .from("profiles")
          .select("id, name, email, manager_id, role")
          .eq("email", email)
          .maybeSingle();

        if (findError) throw findError;

        if (!found) {
          showFeedback("Essa pessoa ainda não tem conta no AuraX — peça pra ela se cadastrar primeiro em login.html.", "error");
          return;
        }
        if (found.id === currentUserId) {
          showFeedback("Esse é o seu próprio e-mail.", "error");
          return;
        }
        if (found.manager_id && found.manager_id !== currentUserId) {
          showFeedback("Essa pessoa já faz parte de outro time.", "error");
          return;
        }
        if (found.manager_id === currentUserId) {
          showFeedback("Essa pessoa já está no seu time.", "error");
          return;
        }

        const { error: updateError } = await supabaseClient
          .from("profiles")
          .update({ manager_id: currentUserId })
          .eq("id", found.id);
        if (updateError) throw updateError;

        posthog.capture("team_member_added");
        showFeedback(`${found.name} foi adicionado(a) ao seu time.`, "success");
        input.value = "";
        await loadTeam();
      } catch (err) {
        showFeedback(err.message || "Não foi possível adicionar agora.", "error");
      } finally {
        addBtn.disabled = false;
      }
    }

    async function removeFromTeam(personId) {
      if (!confirm("Remover esta pessoa do seu time? Ela deixa de aparecer no seu painel.")) return;
      const { error } = await supabaseClient
        .from("profiles")
        .update({ manager_id: null })
        .eq("id", personId);
      if (error) {
        alert("Não foi possível remover agora.");
        return;
      }
      await loadTeam();
    }

    document.getElementById("addBtn").addEventListener("click", addToTeam);
    document.getElementById("addEmailInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); addToTeam(); }
    });
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    });
    document.getElementById("howItWorksBtn").addEventListener("click", () => {
      window.location.href = "index.html?onboarding=1";
    });
    document.getElementById("insightsBtn").addEventListener("click", () => {
      posthog.capture("insights_opened");
      window.location.href = "insights.html";
    });
    document.getElementById("sessionsBtn").addEventListener("click", () => {
      posthog.capture("sessions_ranking_opened");
      window.location.href = "sessoes.html";
    });

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }

      const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("id, name, role, cargo, empresa, email")
        .eq("id", session.user.id)
        .single();

      if (error || !profile || profile.role !== "gestor") {
        window.location.href = "index.html";
        return;
      }

      currentUserId = profile.id;
      posthog.identify(currentUserId, { email: profile.email, role: "gestor" });
      document.getElementById("greeting").textContent = `Olá, ${profile.name}`;
      if (profile.cargo || profile.empresa) {
        const roleEl = document.getElementById("greetingRole");
        roleEl.textContent = [profile.cargo, profile.empresa].filter(Boolean).join(" · ");
        roleEl.style.display = "block";
      }
      document.getElementById("gate").hidden = true;
      document.getElementById("app").hidden = false;

      await loadTeam();
    }

    init();
  </script>
</body>
</html>
