<html lang="pt-BR">

<style>
  .head-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #clientFilter { min-width: 220px; }

  .split { display: flex; flex-direction: column; gap: 20px; }   /* análise da sessão em cima (larga), lista de sessões embaixo */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-faint);
    padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2);
  }
  td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.mono { white-space: nowrap; }
  tr.row-click { cursor: pointer; }
  tr.row-click:hover td { background: var(--surface-2); }
  tr.selected td { background: var(--accent-soft); }
  td.month-row {
    background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--ink-dim);
    padding: 8px 16px;
  }
  .client-cell { display: flex; align-items: center; gap: 10px; min-width: 160px; font-weight: 600; }

  .detail { scroll-margin-top: 20px; }
  .detail-grid { display: grid; grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.6fr); gap: 28px; align-items: start; }
  .word-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 22px; align-items: stretch; }
  .word-groups .word-group { margin-top: 0; }
  .detail-col { min-width: 0; }
  .detail-wide { margin-top: 24px; padding-top: 4px; }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .detail-head h2 { margin: 0; font-size: 16px; }
  .detail-meta { color: var(--ink-faint); font-size: 12px; margin-top: 2px; }
  .detail-body { padding: 16px 18px 18px; }
  .detail-empty { padding: 30px 18px; color: var(--ink-faint); text-align: center; }
  .link-btn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 12px; padding: 2px 6px; border-radius: 6px; }
  .link-btn:hover { background: var(--accent-soft); }
  .link-btn.danger { color: var(--bad); }
  .link-btn.danger:hover { background: var(--bad-soft); }
  input.name-input { font-weight: 600; max-width: 220px; }
  .word-group { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); border-left-width: 3px; }
  .word-group.topics { border-left-color: var(--accent); }
  .word-group.slang { border-left-color: var(--purple); }
  .word-group.fillers { border-left-color: var(--warn); }
  .word-group-head { display: flex; justify-content: space-between; align-items: baseline; }
  .word-group-title { font-size: 11.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
  .word-group.topics .word-group-title { color: var(--accent); }
  .word-group.slang .word-group-title { color: var(--purple); }
  .word-group.fillers .word-group-title { color: var(--warn); }
  .word-group-count { font-size: 12px; font-weight: 600; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .word-group-hint { font-size: 12px; color: var(--ink-faint); margin: 3px 0 8px; line-height: 1.4; }
  .word-group-tags .slang-tag, .word-group-tags .topic-tag, .word-group-tags .filler-tag { display: inline-block; font-size: 12.5px; border-radius: 999px; padding: 3px 10px; margin: 0 4px 6px 0; }
  .topic-tag { background: var(--accent-soft); color: var(--accent); }
  .filler-tag { background: var(--warn-soft); color: var(--warn); }
  .tips-block { margin-top: 4px; }
  .tips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; margin-top: 8px; }
  .tips-col-title { font-size: 11.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 8px; }
  .tips-col.improve .tips-col-title { color: var(--warn); }
  .tips-col.good .tips-col-title { color: var(--good); }
  .tip-card { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; margin-bottom: 8px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .tip-card .ic { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .tip-card.improve .ic { background: var(--warn-soft); color: var(--warn); }
  .tip-card.good .ic { background: var(--good-soft); color: var(--good); }
  .tip-card.improve { border-color: color-mix(in srgb, var(--warn) 28%, var(--line)); }
  .section-label { font-size: 11px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 6px; }
  .section-label:first-child { margin-top: 0; }

  .ring { position: relative; width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; }
  /* anel oco: só a borda colorida (o miolo deixa o vidro aparecer) */
  .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--ring-bg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px)); mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px)); }
  .ring-inner { position: relative; width: 76px; height: 76px; border-radius: 50%; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .ring-inner b { font-size: 26px; font-weight: 700; font-family: var(--mono); }
  .ring-inner small { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
  .detail-top { display: flex; gap: 16px; align-items: center; }
  .sub-row { display: grid; grid-template-columns: 118px minmax(0, 1fr) 34px; gap: 10px; align-items: center; margin-top: 8px; font-size: 13px; }
  .sub-row .mono { text-align: right; }
  .bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 999px; }

  .ai-box { padding: 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); margin-top: 18px; }
  .ai-box h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--purple); }
  .ai-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; margin-top: 6px; font-size: 13px; }
  .ai-row b { font-weight: 600; }
  .ai-row span { color: var(--ink-dim); }
  .oratoria-disclaimer { font-size: 12px; color: var(--ink-faint); margin-top: 10px; }
  .talk-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); margin-top: 6px; }

  /* Modal de comentário */
  #commentOverlay {
    position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center;
    justify-content: center; padding: 20px; z-index: 1000;
  }
  #commentOverlay.hidden { display: none; }
  .comment-modal { width: 100%; max-width: 440px; padding: 24px; }
  .comment-modal h3 { margin: 0 0 4px; font-size: 16px; }
  .comment-target { font-size: 13px; color: var(--ink-dim); margin-bottom: 14px; }
  .comment-modal textarea { width: 100%; min-height: 120px; resize: vertical; }
  .comment-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

  @media (max-width: 1100px) {
    .detail-grid { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  }
</style>

<body class="glass">
  <div id="gate"><p>Carregando...</p></div>

  <div class="shell" id="app" hidden>
    <aside class="sidebar" id="shellSidebar"></aside>
    <div class="shell-main">
      <main class="content">
        <div class="page-head">
          <div>
            <h1>Minhas Sessões</h1>
            <p>Clique em uma sessão para ver a nota detalhada, o resumo e a transcrição.</p>
          </div>
          <div class="head-actions">
            <input type="text" id="clientFilter" placeholder="Filtrar por cliente..." />
            <button type="button" class="btn ghost" id="clearAllBtn">Limpar histórico</button>
          </div>
        </div>

        <div class="split">
          <aside class="card detail" id="detailPanel" aria-live="polite"></aside>
          <div class="section-title">Todas as sessões</div>
          <div class="card">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Cliente</th><th>Data</th><th>Duração</th><th>Oratória</th><th>Vícios</th></tr></thead>
                <tbody id="sessBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="commentOverlay" class="hidden">
    <div class="card comment-modal">
      <h3>Comentário da sessão</h3>
      <div class="comment-target" id="commentTarget"></div>
      <textarea id="commentTextarea" placeholder="Anotações sobre esta sessão..."></textarea>
      <div class="comment-modal-actions">
        <button type="button" class="btn ghost" id="commentCancelBtn">Cancelar</button>
        <button type="button" class="btn" id="commentSaveBtn">Salvar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="shell.js?v=67e68e42"></script>
  <script src="lang.js?v=db14ec62"></script>
  <script src="explain.js?v=5cf58870"></script>
  <script src="focus.js?v=23822fba"></script>
  <script>
    const SUPABASE_URL = "https://tpjdogzhwandxwpwafzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LfW7G2Ai3G2_1Uj_MBRCfg_QIztRQNd";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUserId = null;
    let allSessions = [];
    let filterText = "";
    let selectedId = null;
    let activeCommentId = null;

    const SLANG_LIBRARY = AuraLang.swaps;   // dicionário único em lang.js
    const EXPRESSION_COLORS = {
      Feliz: "var(--good)", Triste: "var(--accent)", Bravo: "var(--bad)", "Nervoso/Medo": "var(--warn)",
      Enjoado: "var(--purple)", Surpreso: "var(--warn)", Focado: "var(--good)",
    };
    const ORATORIA_RANK_TIERS = [
      { min: 90, label: "Excelente", color: "var(--good)" },
      { min: 70, label: "Bom", color: "var(--good)" },
      { min: 50, label: "Médio", color: "var(--warn)" },
      { min: 0, label: "Precisa de atenção", color: "var(--bad)" },
    ];

    function oratoriaScoreRank(score) {
      return ORATORIA_RANK_TIERS.find((tier) => score >= tier.min);
    }
    function scoreColor(score) {
      return score >= 70 ? "var(--good)" : score >= 50 ? "var(--warn)" : "var(--bad)";
    }
    function expressionColor(tag) {
      const label = tag.split("—")[0].trim();
      return EXPRESSION_COLORS[label] || "var(--ink-faint)";
    }
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }
    function formatDateBR(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }
    function formatDuration(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = Math.floor(totalSeconds % 60);
      return `${h > 0 ? h + "h " : ""}${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`;
    }
    function formatClock(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = Math.floor(totalSeconds % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }
    function clientInitials(name) {
      if (!name) return "—";
      return name.trim().split(/\s+/).slice(0, 2).map((p) => p[0].toUpperCase()).join("");
    }
    function monthKey(dateStr) {
      const d = new Date(dateStr);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }
    function monthLabel(dateStr) {
      const t = new Date(dateStr).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
      return t.charAt(0).toUpperCase() + t.slice(1);   // "Outubro de 2026" (só a 1ª letra maiúscula)
    }
    function sumCounts(counts) {
      return Object.values(counts || {}).reduce((a, b) => a + b, 0);
    }

    function renderKeywordTags(counts) {
      const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
      return entries.map(([kw, count]) => `<span class="keyword-tag">${escapeHtml(kw)} × ${count}</span>`).join(" ");
    }
    function renderFillerTags(counts) {
      const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
      return entries.map(([w, c]) => `<span class="filler-tag">${escapeHtml(w)} × ${c}</span>`).join(" ");
    }
    function renderTopicTags(counts) {
      const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
      return entries.map(([w, c]) => `<span class="topic-tag">${escapeHtml(w)} × ${c}</span>`).join(" ");
    }
    // Um painel por tipo de palavra: assunto da conversa, gírias (com a troca sugerida) e vícios.
    function wordGroup(cls, title, hint, counts, tagsHtml) {
      if (!tagsHtml) return "";
      const total = sumCounts(counts);
      return `<div class="word-group ${cls}"><div class="word-group-head"><span class="word-group-title">${title}</span><span class="word-group-count">${total}×</span></div><div class="word-group-hint">${hint}</div><div class="word-group-tags">${tagsHtml}</div></div>`;
    }
    function renderSlangTags(counts) {
      const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
      return entries
        .map(([word, count]) => {
          const suggestion = SLANG_LIBRARY[word];
          return `<span class="slang-tag" title="${escapeHtml(AuraLang.catLabel(word))}">${escapeHtml(word)}${suggestion ? ` → ${escapeHtml(suggestion)}` : ""} × ${count}</span>`;
        })
        .join(" ");
    }
    // Dicas da sessão em cartões, separando o que melhorar do que foi bem (sempre visíveis: são o coração do produto).
    function renderTipsBlock(tips) {
      if (!tips || !tips.length) return "";
      const card = (t) => `<div class="tip-card ${t.type === "positivo" ? "good" : "improve"}"><span class="ic">${t.type === "positivo" ? "✓" : "→"}</span><span>${escapeHtml(t.text)}</span></div>`;
      const improve = tips.filter((t) => t.type !== "positivo"), good = tips.filter((t) => t.type === "positivo");
      const col = (cls, title, list) => list.length ? `<div class="tips-col ${cls}"><div class="tips-col-title">${title} (${list.length})</div>${list.map(card).join("")}</div>` : "";
      return `<div class="tips-block"><div class="section-label">Dicas desta sessão</div><div class="tips-grid">${col("improve", "Para melhorar", improve)}${col("good", "O que foi bem", good)}</div></div>`;
    }

    function renderCoachingTips(tips) {
      if (!tips || !tips.length) return "";
      return tips
        .map((t) => `<div class="insight-line ${t.type === "positivo" ? "tip-positive" : "tip-improve"}">${t.type === "positivo" ? "✓" : "→"} ${escapeHtml(t.text)}</div>`)
        .join("");
    }
    function renderTranscriptLineHtml(line) {
      const color = expressionColor(line.expression || "");
      const hasKeywords = line.keywords && line.keywords.length;
      const hasSlang = line.slang && line.slang.length;
      const tagsHtml = (hasKeywords ? `<div class="keyword-tags">${line.keywords.map((k) => `<span class="keyword-tag">${escapeHtml(k)}</span>`).join("")}</div>` : "") +
        (hasSlang ? `<div class="keyword-tags">${line.slang.map((w) => `<span class="slang-tag">${escapeHtml(w)}${SLANG_LIBRARY[w] ? ` → ${escapeHtml(SLANG_LIBRARY[w])}` : ""}</span>`).join("")}</div>` : "");
      const speakerTagHtml = "";  // análise individual: sem rótulo de quem falou
      const flagClass = hasKeywords ? " transcript-flagged" : hasSlang ? " transcript-slang" : "";
      return `
        <div class="transcript-line${flagClass}">
          <span class="transcript-time">${formatClock(line.t)}</span>${speakerTagHtml}${escapeHtml(line.text)}
          <span class="transcript-expression"><span class="expr-dot" style="background:${color}"></span>${escapeHtml(line.expression || "")}</span>
          ${tagsHtml}
        </div>`;
    }

    function oratoriaPillHtml(score) {
      if (score == null) return '<span class="oratoria-pill" style="color:var(--ink-faint); border-color:var(--line)">Sem nota</span>';
      const rank = oratoriaScoreRank(score);
      return `<span class="oratoria-pill" style="color:${rank.color}; border-color:${rank.color}"><span class="mono">${score}</span> ${rank.label}</span>`;
    }

    // ===== Lista (tabela agrupada por mês) =====
    function visibleSessions() {
      const filtered = filterText
        ? allSessions.filter((h) => (h.client_name || "").toLowerCase().includes(filterText))
        : allSessions;
      return [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function renderSessionsList() {
      const bodyEl = document.getElementById("sessBody");
      const list = visibleSessions();

      if (!list.length) {
        bodyEl.innerHTML = `<tr><td colspan="6" class="empty-state">${allSessions.length ? "Nenhuma sessão encontrada para esse cliente." : "Nenhuma sessão salva ainda."}</td></tr>`;
        document.getElementById("detailPanel").innerHTML = '<div class="detail-empty">Selecione uma sessão para ver os detalhes.</div>';
        return;
      }
      if (!list.some((s) => String(s.id) === String(selectedId))) selectedId = list[0].id;

      let html = "";
      let lastMonth = "";
      list.forEach((h) => {
        const key = monthKey(h.date);
        if (key !== lastMonth) {
          html += `<tr><td class="month-row" colspan="5">${monthLabel(h.date)}</td></tr>`;
          lastMonth = key;
        }
        html += `
          <tr class="row-click${String(h.id) === String(selectedId) ? " selected" : ""}" data-id="${h.id}" tabindex="0">
            <td><div class="client-cell"><span class="client-avatar">${clientInitials(h.client_name)}</span>${h.client_name ? escapeHtml(h.client_name) : "Sessão sem cliente"}</div></td>
            <td class="mono">${formatDateBR(h.date)}</td>
            <td class="mono">${formatDuration(h.duration || 0)}</td>
            <td>${oratoriaPillHtml(h.oratoria_score)}</td>
            <td class="mono">${sumCounts(AuraShell.cleanFillers(h.filler_counts))}</td>
          </tr>`;
      });
      bodyEl.innerHTML = html;
      renderSessionDetail(allSessions.find((s) => String(s.id) === String(selectedId)));
    }

    // ===== Painel de detalhe =====
    function renderOratoriaDetail(h) {
      if (h.oratoria_score == null) {
        return '<div class="insight-line">Sem fala suficiente pra ter calculado uma nota de oratória nesta sessão.</div>';
      }
      const color = scoreColor(h.oratoria_score);
      const rank = oratoriaScoreRank(h.oratoria_score);
      const subScores = h.oratoria_subscores;
      const barsHtml = subScores && subScores.length
        ? subScores.map((s) => `
            <div class="sub-row">
              <span>${escapeHtml(s.label)}</span>
              <div class="bar"><span style="width:${Math.round(s.score)}%; background:${scoreColor(s.score)}"></span></div>
              <span class="mono">${Math.round(s.score)}</span>
            </div>`).join("")
        : '<div class="insight-line" style="margin-top:10px">Detalhamento por critério não disponível: essa sessão foi gravada antes desse detalhamento existir.</div>';
      return `
        <div class="detail-top">
          <div class="ring" style="--ring-bg:conic-gradient(${color} ${h.oratoria_score}%, color-mix(in srgb, var(--ink-faint) 28%, transparent) 0)">
            <div class="ring-inner"><b style="color:${color}">${h.oratoria_score}</b><small>/100</small></div>
          </div>
          <div><span class="oratoria-pill" style="color:${rank.color}; border-color:${rank.color}">${rank.label}</span></div>
        </div>
        <div style="margin-top:10px">${barsHtml}</div>
        <div class="oratoria-disclaimer">Aproximação por ritmo, pausas, vícios, confiança do reconhecimento de fala e variação de volume. Não é avaliação fonoaudiológica.</div>
        ${window.AuraExplain ? AuraExplain.html(h) : ""}`;
    }

    // As 5 sessões anteriores à selecionada, só pra comparar no cartão de foco.
    function previousSessionsOf(h) {
      const t = new Date(h.date).getTime();
      return allSessions
        .filter((s) => s.id !== h.id && new Date(s.date).getTime() < t)
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .slice(0, 5);
    }

    function renderSessionDetail(h) {
      const panel = document.getElementById("detailPanel");
      if (!h) { panel.innerHTML = '<div class="detail-empty">Selecione uma sessão para ver os detalhes.</div>'; return; }

      const negotiationTagsHtml = renderTopicTags(h.keyword_counts);
      const slangTagsHtml = renderSlangTags(h.slang_counts);
      const cleanFillerCounts = AuraShell.cleanFillers(h.filler_counts);
      const fillerTagsHtml = renderFillerTags(cleanFillerCounts);

      const aiHtml = h.ai_summary
        ? `<div class="ai-box"><h3>Resumo por IA</h3>
            <div class="ai-row"><b>Objetivo</b><span>${escapeHtml(h.ai_summary.objetivo)}</span></div>
            <div class="ai-row"><b>Objeção</b><span>${escapeHtml(h.ai_summary.objecao)}</span></div>
            <div class="ai-row"><b>Próximo passo</b><span>${escapeHtml(h.ai_summary.proximo_passo)}</span></div></div>`
        : "";

      const dynamicsHtml = h.dynamics
        ? `<div class="talk-bar"><div style="width:${h.dynamics.pctYou}%; background:var(--accent)"></div><div style="width:${h.dynamics.pctOther}%; background:var(--warn)"></div></div>
           <div class="session-secondary-stats">Você falou ${h.dynamics.pctYou}% do tempo · ouvindo ou em silêncio ${h.dynamics.pctOther}%</div>`
        : '<div class="insight-line">Sem falas suficientes pra medir a dinâmica da conversa.</div>';

      panel.innerHTML = `
        <div class="detail-head" data-id="${h.id}">
          <div>
            <h2 class="detail-name">${h.client_name ? escapeHtml(h.client_name) : "Sessão sem cliente"}</h2>
            <div class="detail-meta">${formatDateBR(h.date)} · ${formatDuration(h.duration || 0)}</div>
          </div>
          <div style="display:flex; gap:2px; flex-wrap:wrap; justify-content:flex-end">
            <button type="button" class="link-btn" data-act="crm" title="Copia um resumo (sem transcrição) pra colar numa nota do CRM">Copiar resumo p/ CRM</button>
            <button type="button" class="link-btn" data-act="edit">Editar nome</button>
            <button type="button" class="link-btn" data-act="comment">${h.notes ? "Ver comentário" : "Comentar"}</button>
            <button type="button" class="link-btn danger" data-act="delete">Excluir</button>
          </div>
        </div>
        <div class="detail-body">
          <div class="detail-grid">
            <div class="detail-col">
              <div class="section-label">Nota de oratória</div>
              ${renderOratoriaDetail(h)}
            </div>
            <div class="detail-col">
              ${window.AuraFocus ? window.AuraFocus.render(h, previousSessionsOf(h)) : ""}
              ${aiHtml}
              <div class="section-label" style="margin-top:18px">Dinâmica da sessão</div>
              ${dynamicsHtml}
              ${h.wpm != null ? `<div class="session-secondary-stats">Ritmo ${h.wpm} palavras/min · Pausas longas ${h.pauses || 0}</div>` : ""}
            </div>
          </div>
          ${negotiationTagsHtml || slangTagsHtml || fillerTagsHtml ? `<div class="word-groups">
            ${wordGroup("topics", "Palavras-chave", "Assuntos que apareceram na conversa", h.keyword_counts, negotiationTagsHtml)}
            ${wordGroup("slang", "Gírias", "Informal demais para a reunião — a seta mostra a troca sugerida", h.slang_counts, slangTagsHtml)}
            ${wordGroup("fillers", "Vícios de linguagem", "Muletas que quebram o raciocínio — troque por uma pausa curta", cleanFillerCounts, fillerTagsHtml)}
          </div>` : ""}
          <div class="detail-wide">
            ${renderTipsBlock(h.tips)}
            ${h.objections && h.objections.length ? `<div class="section-label">Objeções (${h.objections.length})</div>
              ${h.objections.map((o) => `<div class="insight-line">${formatClock(o.t)} — "${escapeHtml(o.phrase)}" → ${escapeHtml(o.result)}</div>`).join("")}` : ""}
            ${h.notes ? `<div class="section-label">Seu comentário</div><div class="insight-line">${escapeHtml(h.notes)}</div>` : ""}
            ${h.transcript && h.transcript.length ? `<details class="session-transcript"><summary>Ver transcrição (${h.transcript.length} falas)</summary>${h.transcript.map(renderTranscriptLineHtml).join("")}</details>` : ""}
          </div>
        </div>`;
    }

    // ===== Dados =====
    async function loadSessions() {
      const { data, error } = await supabaseClient
        .from("sessions").select("*").eq("user_id", currentUserId).order("date", { ascending: false });
      if (error) { console.error("Erro ao carregar sessões:", error.message); return []; }
      return data;
    }
    async function refreshSessions() {
      allSessions = await loadSessions();
      renderSessionsList();
    }

    document.getElementById("clientFilter").addEventListener("input", (e) => {
      filterText = e.target.value.trim().toLowerCase();
      renderSessionsList();
    });
    document.getElementById("clearAllBtn").addEventListener("click", async () => {
      if (!confirm("Limpar todo o histórico? Essa ação não pode ser desfeita.")) return;
      await supabaseClient.from("sessions").delete().eq("user_id", currentUserId);
      await refreshSessions();
    });

    document.getElementById("sessBody").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      selectedId = tr.dataset.id;
      renderSessionsList();
      document.getElementById("detailPanel").scrollIntoView({ behavior: "smooth", block: "start" });  // a análise fica em cima
    });
    document.getElementById("sessBody").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const tr = e.target.closest("tr[data-id]");
      if (tr) tr.click();
    });

    function startEditingClientName(id) {
      const session = allSessions.find((s) => String(s.id) === String(id));
      if (!session) return;
      const nameEl = document.querySelector("#detailPanel .detail-name");
      const input = document.createElement("input");
      input.type = "text";
      input.className = "name-input";
      input.value = session.client_name || "";
      input.placeholder = "Nome do cliente";
      nameEl.replaceWith(input);
      input.focus();
      input.select();
      const commit = async () => {
        await supabaseClient.from("sessions").update({ client_name: input.value.trim() }).eq("id", id);
        await refreshSessions();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); input.blur(); }
        else if (e.key === "Escape") { input.value = session.client_name || ""; input.blur(); }
      });
      input.addEventListener("blur", commit, { once: true });
    }

    function openCommentModal(sessionId) {
      const session = allSessions.find((s) => String(s.id) === String(sessionId));
      if (!session) return;
      activeCommentId = sessionId;
      document.getElementById("commentTarget").textContent =
        session.client_name ? `Cliente: ${session.client_name}` : formatDateBR(session.date);
      document.getElementById("commentTextarea").value = session.notes || "";
      document.getElementById("commentOverlay").classList.remove("hidden");
      document.getElementById("commentTextarea").focus();
    }
    function closeCommentModal() {
      document.getElementById("commentOverlay").classList.add("hidden");
      activeCommentId = null;
    }
    document.getElementById("commentCancelBtn").addEventListener("click", closeCommentModal);
    document.getElementById("commentOverlay").addEventListener("click", (e) => {
      if (e.target.id === "commentOverlay") closeCommentModal();
    });
    document.getElementById("commentSaveBtn").addEventListener("click", async () => {
      if (!activeCommentId) return;
      const notes = document.getElementById("commentTextarea").value;
      await supabaseClient.from("sessions").update({ notes }).eq("id", activeCommentId);
      posthog.capture("session_comment_saved");
      closeCommentModal();
      await refreshSessions();
    });

    document.getElementById("detailPanel").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      const id = btn.closest("[data-id]").dataset.id;
      if (btn.dataset.act === "crm") {
        const h = allSessions.find((x) => String(x.id) === String(id));
        if (!h || !window.AuraFocus) return;
        const ok = await AuraFocus.copyText(AuraFocus.crmNote(h, previousSessionsOf(h)));
        const original = btn.textContent;
        btn.textContent = ok ? "Copiado ✓" : "Não consegui copiar";
        setTimeout(() => { btn.textContent = original; }, 2000);
        if (ok) posthog.capture("crm_note_copied", { source: "sessoes" });
      } else if (btn.dataset.act === "edit") startEditingClientName(id);
      else if (btn.dataset.act === "comment") openCommentModal(id);
      else if (btn.dataset.act === "delete") {
        if (!confirm("Excluir esta sessão? Essa ação não pode ser desfeita.")) return;
        await supabaseClient.from("sessions").delete().eq("id", id);
        selectedId = null;
        await refreshSessions();
      }
    });

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }
      currentUserId = session.user.id;
      posthog.identify(currentUserId, { email: session.user.email });

      document.getElementById("gate").hidden = true;
      document.getElementById("app").hidden = false;

      AuraShell.init({ active: "sessoes", client: supabaseClient, session });
      // Vindo do modal "Sessão gravada": já abre a sessão que acabou de terminar.
      const wantedId = new URLSearchParams(location.search).get("id");
      if (wantedId) {
        selectedId = wantedId;
        history.replaceState(null, "", location.pathname);
      }
      await refreshSessions();
    }

    init();
  </script>
</body>
</html>
