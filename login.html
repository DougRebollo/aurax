<style>
  body { display: flex; align-items: flex-start; justify-content: center; padding: 20px; min-height: 100vh; }
  .auth-wrap { display: flex; align-items: flex-start; justify-content: center; gap: 22px; width: 100%; margin-block: auto; }  /* centraliza quando cabe; rola do topo quando o cadastro fica alto */
  .role-info { width: 300px; max-width: 100%; padding: 22px 22px; flex: none; backface-visibility: hidden; transform-origin: right center; }
  .role-info[hidden] { display: none; }
  .role-info.flip { animation: riFlip .65s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes riFlip {
    0% { opacity: 0; transform: perspective(900px) rotateY(-110deg) scale(0.88); }
    55% { opacity: 1; }
    100% { opacity: 1; transform: perspective(900px) rotateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .role-info.flip { animation: none; } }
  .ri-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .ri-tag.preview { background: var(--surface-2); color: var(--ink-faint); border: 1px solid var(--line); }
  .role-info h3 { margin: 10px 0 6px; font-size: 20px; letter-spacing: -0.02em; }
  .ri-for { margin: 0 0 12px; font-size: 14px; color: var(--ink-dim); line-height: 1.5; }
  .ri-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .ri-list li { position: relative; padding-left: 24px; font-size: 13.5px; line-height: 1.45; }
  .ri-list li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 17px; height: 17px; border-radius: 50%; background: var(--good-soft); color: var(--good); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .ri-note { margin: 16px 0 0; padding: 11px 13px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
  @media (max-width: 900px) { .role-info { display: none !important; } .auth-wrap { justify-content: center; } }
  .card { width: 100%; max-width: 430px; padding: 32px 28px; }
  /* entrada suave dos cartões */
  .auth-wrap > .card { animation: cardIn .55s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }

  /* etapas do cadastro */
  .steps { list-style: none; display: flex; justify-content: center; gap: 6px; margin: -8px 0 18px; padding: 0; font-size: 11.5px; color: var(--ink-faint); }
  .steps[hidden] { display: none; }
  .steps li { display: flex; align-items: center; gap: 6px; }
  .steps li[hidden] { display: none; }
  .steps li + li::before { content: ""; width: 18px; height: 1px; background: var(--line); margin-right: 2px; }
  .steps i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); }
  .steps li.on { color: var(--ink); font-weight: 600; } .steps li.on i { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }

  /* escolha do tipo de conta em cartões */
  .role-label { margin-top: 0; }
  .role-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .role-option {
    position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
    padding: 14px 14px 13px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-dim); cursor: pointer;
    transition: transform .28s cubic-bezier(.2, .9, .3, 1.3), border-color .25s, box-shadow .25s, background .25s;
  }
  .role-option::after { /* brilho que passa ao apontar */
    content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .45) 50%, transparent 65%); transform: translateX(-120%); pointer-events: none;
  }
  .role-option:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 12px 26px -14px color-mix(in srgb, var(--accent) 70%, transparent); }
  .role-option:hover::after { transform: translateX(120%); transition: transform .7s ease; }
  .role-option:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .ro-icon { width: 26px; height: 26px; margin-bottom: 4px; color: var(--ink-faint); transition: color .25s, transform .35s cubic-bezier(.2, .9, .3, 1.4); }
  .ro-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .ro-desc { font-size: 12px; line-height: 1.35; color: var(--ink-dim); font-weight: 400; }
  .ro-check { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700;
    background: var(--accent); color: var(--on-accent, #fff); transform: scale(0); opacity: 0; transition: transform .35s cubic-bezier(.2, 1.6, .4, 1), opacity .2s; }
  .role-option.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent), 0 14px 28px -16px color-mix(in srgb, var(--accent) 80%, transparent); }
  .role-option.selected .ro-check { transform: scale(1); opacity: 1; }
  .role-option.selected .ro-icon { color: var(--accent); transform: scale(1.08); }
  .role-option.pop { animation: roPop .4s cubic-bezier(.2, .9, .3, 1.4); }
  @keyframes roPop { 0% { transform: scale(.96); } 60% { transform: scale(1.03); } 100% { transform: none; } }

  /* campos do cadastro surgindo em sequência */
  .reveal > * { animation: fieldIn .45s cubic-bezier(.2, .8, .2, 1) both; }
  .reveal > *:nth-child(1) { animation-delay: .02s; } .reveal > *:nth-child(2) { animation-delay: .07s; } .reveal > *:nth-child(3) { animation-delay: .12s; }
  .reveal > *:nth-child(4) { animation-delay: .17s; } .reveal > *:nth-child(5) { animation-delay: .22s; }
  @keyframes fieldIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* senha com olhinho */
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 44px !important; }
  .pw-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; border-radius: 50%; background: none; color: var(--ink-faint); display: grid; place-items: center; cursor: pointer; transition: color .2s, background .2s; }
  .pw-eye:hover { color: var(--ink); background: var(--surface-2); }
  .pw-eye svg { width: 19px; height: 19px; }
  .pw-eye .slash { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s ease; }
  .pw-eye[aria-pressed="true"] { color: var(--accent); } .pw-eye[aria-pressed="true"] .slash { stroke-dashoffset: 0; }

  /* cargo e empresa lado a lado */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two-col > div { min-width: 0; }
  @media (max-width: 420px) { .two-col { grid-template-columns: 1fr; gap: 0; } }
  input.need { border-color: var(--bad) !important; animation: needShake .35s; }
  @keyframes needShake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* botão principal com brilho */
  button.submit { position: relative; overflow: hidden; transition: transform .2s, box-shadow .25s, filter .2s; box-shadow: 0 10px 24px -12px color-mix(in srgb, var(--accent) 80%, transparent); }
  button.submit::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .35) 50%, transparent 65%); transform: translateX(-120%); }
  button.submit:hover:not(:disabled) { transform: translateY(-1px); } button.submit:hover:not(:disabled)::after { transform: translateX(120%); transition: transform .8s ease; }
  button.submit:active:not(:disabled) { transform: scale(.985); }
  .toggle-row button { margin-left: 6px; border-radius: 6px; } .toggle-row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .auth-wrap > .card, .reveal > *, .role-option.pop { animation: none; } .role-option, button.submit { transition: none; } }
  .logo::before { content: ""; flex: none; background: url(assets/favicon.svg) center / contain no-repeat; width: 32px; height: 32px; }
  .logo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { text-align: center; font-size: 13px; color: var(--ink-dim); margin-bottom: 22px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-dim); margin: 14px 0 6px; }
  input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px 12px; }
  input[type="password"] { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; font: inherit; outline: none; }
  input[type="password"]:focus { border-color: var(--accent); }
  button.submit { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; }
  button.submit:hover { filter: brightness(0.94); }
  button.submit:disabled { opacity: 0.55; cursor: not-allowed; }
  .toggle-row { text-align: center; margin-top: 18px; font-size: 13px; color: var(--ink-dim); }
  .toggle-row button { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; }
  .message { margin-top: 16px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
  .message.error { display: block; background: var(--bad-soft); color: var(--bad); }
  .message.success { display: block; background: var(--good-soft); color: var(--good); }
  #nameField { display: none; }
  .role-hint { font-size: 12.5px; color: var(--ink-dim); margin: 8px 0 0; line-height: 1.45; }
  .forgot-row { text-align: right; margin-top: 8px; }
  .legal-note { margin: 12px 0 0; font-size: 12px; line-height: 1.5; color: var(--ink-faint); text-align: center; }
  .legal-note a { color: var(--accent); }
  .forgot-row button { background: none; border: 0; color: var(--accent); font-size: 12.5px; font-weight: 600; padding: 0; }
  .invite-banner { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); color: var(--ink); font-size: 13px; line-height: 1.45; margin: 0 0 14px; text-align: left; }
</style>

<body class="glass">
  <div class="auth-wrap">
  <aside class="card role-info" id="roleInfo" aria-live="polite" hidden></aside>
  <div class="card">
    <div class="logo">AuraX</div>
    <div class="subtitle" id="formSubtitle">Entre com sua conta</div>
    <ol class="steps" id="steps" hidden><li class="on"><i>1</i>Conta</li><li><i>2</i>Código no e-mail</li><li id="stepPlan"><i>3</i>Plano</li></ol>
    <div class="invite-banner" id="inviteBanner" hidden></div>

    <form id="authForm">
      <div id="nameField">
        <label class="role-label">Como você vai usar o AuraX?</label>
        <div class="role-toggle" id="roleToggle" role="radiogroup" aria-label="Tipo de conta">
          <button type="button" class="role-option selected" data-role="funcionario" role="radio" aria-checked="true">
            <span class="ro-check" aria-hidden="true">✓</span>
            <svg class="ro-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.6 3.6-6 8-6s8 2.4 8 6"/></svg>
            <span class="ro-title">Individual</span>
            <span class="ro-desc">Só eu, para evoluir a minha fala</span>
          </button>
          <button type="button" class="role-option" data-role="gestor" role="radio" aria-checked="false">
            <span class="ro-check" aria-hidden="true">✓</span>
            <svg class="ro-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.2 2.9-5.3 6.5-5.3s6.5 2.1 6.5 5.3"/><circle cx="17.5" cy="9" r="2.6"/><path d="M17 14.9c2.7.2 4.6 1.9 4.6 4.3"/></svg>
            <span class="ro-title">Gestor</span>
            <span class="ro-desc">Eu e meu time de vendas</span>
          </button>
        </div>
        <p class="role-hint" id="roleHint" hidden></p>

        <label for="nameInput">Nome</label>
        <input type="text" id="nameInput" placeholder="Seu nome" autocomplete="name" />

        <div class="two-col">
          <div>
            <label for="cargoInput">Cargo</label>
            <input type="text" id="cargoInput" placeholder="Ex: Gerente Comercial" autocomplete="organization-title" />
          </div>
          <div>
            <label for="empresaInput">Empresa</label>
            <input type="text" id="empresaInput" placeholder="Ex: Registro Rural" autocomplete="organization" />
          </div>
        </div>
      </div>

      <label for="emailInput">E-mail</label>
      <input type="email" id="emailInput" placeholder="voce@empresa.com" required autocomplete="email" />

      <label for="passwordInput">Senha</label>
      <div class="pw-wrap">
        <input type="password" id="passwordInput" placeholder="Sua senha" required minlength="6" />
        <button type="button" class="pw-eye" id="pwEye" aria-label="Mostrar senha" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="4" y1="4" x2="20" y2="20"/></svg>
        </button>
      </div>
      <div class="forgot-row" id="forgotRow"><button type="button" id="forgotBtn">Esqueci minha senha</button></div>

      <button type="submit" class="submit" id="submitBtn">Entrar</button>
      <p class="legal-note" id="legalNote" style="display:none">Ao criar a conta, você concorda com os <a href="termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.</p>
    </form>

    <form id="resetForm" hidden>
      <label for="newPassword">Nova senha</label>
      <input type="password" id="newPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
      <label for="newPassword2">Repita a nova senha</label>
      <input type="password" id="newPassword2" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
      <button type="submit" class="submit" id="resetBtn">Salvar nova senha</button>
    </form>

    <div class="toggle-row" id="toggleRow">
      <span id="toggleText">Ainda não tem conta?</span>
      <button type="button" id="toggleModeBtn">Criar conta</button>
    </div>

    <div class="message" id="messageBox"></div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="otp-modal.js?v=0d69cf5e"></script>
  <script>
    const SUPABASE_URL = "https://tpjdogzhwandxwpwafzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LfW7G2Ai3G2_1Uj_MBRCfg_QIztRQNd";
    // O link do e-mail de recuperação chega como #...type=recovery; guardamos antes de o supabase-js limpar o hash.
    const RECOVERY = /type=recovery/.test(location.hash);
    const LINK_ERROR = /error_code=/.test(location.hash);
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mode = "login"; // ou "signup"
    let selectedRole = "funcionario";

    const form = document.getElementById("authForm");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("nameInput");
    const roleToggle = document.getElementById("roleToggle");
    const cargoInput = document.getElementById("cargoInput");
    const empresaInput = document.getElementById("empresaInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submitBtn");
    const toggleModeBtn = document.getElementById("toggleModeBtn");
    const toggleText = document.getElementById("toggleText");
    const formSubtitle = document.getElementById("formSubtitle");
    const messageBox = document.getElementById("messageBox");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
    }

    function clearMessage() {
      messageBox.className = "message";
      messageBox.textContent = "";
    }

    // "Individual" = conta sem gestor (no banco continua role "funcionario", sem manager_id).
    const ROLE_HINTS = {
      funcionario: "Para você se avaliar sozinho: nota, vícios e gírias, foco e evolução.",
      gestor: "Para acompanhar um time de até 5 pessoas, além da sua própria autoavaliação.",
    };
    const ROLE_INFO = {
      funcionario: {
        title: "Individual", who: "Para você que vende e quer evoluir a própria fala, sozinho.",
        items: [
          "Nota de oratória de 0 a 100 a cada call",
          "Vícios e gírias detectados, com a troca sugerida",
          "Foco para a próxima reunião e dicas práticas",
          "Histórico e evolução ao longo do tempo",
        ],
        note: "Só você vê as suas sessões.",
      },
      gestor: {
        title: "Gestor", who: "Para quem lidera um time de vendas e quer acompanhar a evolução de todos.",
        items: [
          "Tudo do Individual, para você",
          "Painel com a evolução do time (você + até 5 pessoas)",
          "Convite dos colaboradores por e-mail",
          "Comparativo por semana, mês e ano",
        ],
        note: "Cada colaborador continua com a própria autoavaliação.",
      },
    };
    const roleInfo = document.getElementById("roleInfo");
    let inviteActive = false;
    let lastInfoKey = "";
    function renderRoleInfo(role, preview) {
      const d = ROLE_INFO[role]; if (!d) return;
      roleInfo.innerHTML = '<span class="ri-tag' + (preview ? " preview" : "") + '">' + (preview ? "Pré-visualização" : "Selecionado") + "</span>" +
        "<h3>" + d.title + '</h3><p class="ri-for">' + d.who + '</p><ul class="ri-list">' + d.items.map((i) => "<li>" + i + "</li>").join("") + "</ul>" +
        '<p class="ri-note">' + d.note + "</p>";
      // gira e surge só quando troca de plano (não a cada re-render do mesmo)
      if (role !== lastInfoKey) {
        lastInfoKey = role;
        roleInfo.classList.remove("flip"); void roleInfo.offsetWidth; roleInfo.classList.add("flip");
      }
    }
    function syncRoleInfo() {
      roleInfo.hidden = !(mode === "signup" && !inviteActive);
      if (roleInfo.hidden) lastInfoKey = "";
      if (!roleInfo.hidden) renderRoleInfo(selectedRole, false);
    }
    roleToggle.addEventListener("mouseover", (e) => { const b = e.target.closest(".role-option"); if (b && mode === "signup") renderRoleInfo(b.dataset.role, b.dataset.role !== selectedRole); });
    roleToggle.addEventListener("focusin", (e) => { const b = e.target.closest(".role-option"); if (b && mode === "signup") renderRoleInfo(b.dataset.role, b.dataset.role !== selectedRole); });
    roleToggle.addEventListener("mouseleave", () => { if (mode === "signup") renderRoleInfo(selectedRole, false); });
    roleToggle.addEventListener("focusout", () => { if (mode === "signup") renderRoleInfo(selectedRole, false); });
    const roleHint = document.getElementById("roleHint");
    function updateRoleHint() { roleHint.textContent = ROLE_HINTS[selectedRole] || ""; }
    updateRoleHint();
    roleToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".role-option");
      if (!btn) return;
      roleToggle.querySelectorAll(".role-option").forEach((b) => { b.classList.remove("selected", "pop"); b.setAttribute("aria-checked", "false"); });
      btn.classList.add("selected"); btn.setAttribute("aria-checked", "true");
      void btn.offsetWidth; btn.classList.add("pop");
      selectedRole = btn.dataset.role;
      updateRoleHint();
      syncRoleInfo();
    });

    [nameInput, cargoInput, empresaInput].forEach((el) => el.addEventListener("input", () => el.classList.remove("need")));

    // Mostrar/esconder a senha
    const pwEye = document.getElementById("pwEye");
    pwEye.addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      pwEye.setAttribute("aria-pressed", String(show)); pwEye.setAttribute("aria-label", show ? "Esconder senha" : "Mostrar senha");
    });
    toggleModeBtn.addEventListener("click", () => {
      mode = mode === "login" ? "signup" : "login";
      clearMessage();
      const steps = document.getElementById("steps");
      if (mode === "signup") {
        steps.hidden = false;
        document.getElementById("stepPlan").hidden = inviteActive;   // colaborador convidado não escolhe plano
        passwordInput.placeholder = "Mínimo de 6 caracteres"; passwordInput.autocomplete = "new-password";
        nameField.classList.remove("reveal"); void nameField.offsetWidth; nameField.classList.add("reveal");
        nameField.style.display = "block";
        submitBtn.textContent = "Criar conta";
        legalNote.style.display = "block";
        formSubtitle.textContent = "Crie sua conta no AuraX";
        toggleText.textContent = "Já tem conta?";
        toggleModeBtn.textContent = "Entrar";
      } else {
        steps.hidden = true;
        passwordInput.placeholder = "Sua senha"; passwordInput.autocomplete = "current-password";
        nameField.style.display = "none";
        submitBtn.textContent = "Entrar";
        legalNote.style.display = "none";
        formSubtitle.textContent = "Entre com sua conta";
        toggleText.textContent = "Ainda não tem conta?";
        toggleModeBtn.textContent = "Criar conta";
      }
      syncRoleInfo();
    });

    // Depois de logado, manda cada papel pra tela certa.
    // fresh = acabou de criar/confirmar a conta: mostra a tela de plano (que tem um X para fechar).
    // Nos acessos seguintes a pessoa vai direto para o app; sem plano ela só não consegue gravar.
    async function redirectByRole(opts) {
      const fresh = !!(opts && opts.fresh);
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;

      // Convite de time: se esta conta foi convidada por um gestor (pelo link ou pelo e-mail),
      // entra no time dele ANTES de checar o pagamento — o acesso do funcionário segue o plano do gestor.
      let inviteToken = null;
      try { inviteToken = localStorage.getItem("aurax_invite"); } catch (e) { /* sem armazenamento */ }
      try {
        const { data: claim } = await supabaseClient.rpc("claim_team_invites", { p_token: inviteToken });
        if (claim === "ok") posthog.capture("team_invite_accepted");
        if (claim && claim !== "sem_login") { try { localStorage.removeItem("aurax_invite"); } catch (e) { /* ok */ } }
      } catch (e) { /* função ainda não existe no banco: segue sem convite */ }

      const { data: profile } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      // Pagamento pendente bloqueia a conta inteira (gestor e time) — nunca
      // deixa passar pra tela de gravação ou pro painel antes de confirmar.
      const { data: accountStatus } = await supabaseClient.rpc("effective_account_status", { uid: user.id });
      if (accountStatus === "pendente_pagamento" && fresh) {
        window.location.href = "pagamento-pendente.html";
        return;
      }

      if (profile && profile.role === "gestor") {
        window.location.href = "painel-gestor.html";
      } else {
        window.location.href = "app.html";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();
      submitBtn.disabled = true;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        if (mode === "signup") {
          const name = nameInput.value.trim();
          const cargo = cargoInput.value.trim();
          const empresa = empresaInput.value.trim();
          const missing = [[nameInput, name], [cargoInput, cargo], [empresaInput, empresa]].filter((f) => !f[1]);
          if (missing.length) {
            missing.forEach((f) => { f[0].classList.remove("need"); void f[0].offsetWidth; f[0].classList.add("need"); });
            missing[0][0].focus();
            showMessage("Preencha nome, cargo e empresa para criar a conta.", "error");
            submitBtn.disabled = false;
            return;
          }
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { name, cargo, empresa, role: selectedRole } },
          });
          if (error) throw error;

          if (data.user && !data.session) {
            posthog.identify(data.user.id, { email });
            posthog.capture("signup_completed", { pending_email_confirmation: true });
            openEmailOtp(email);
          } else {
            posthog.identify(data.user.id, { email });
            posthog.capture("signup_completed");
            await redirectByRole({ fresh: true });
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          posthog.identify(data.user.id, { email });
          posthog.capture("login_completed");
          await redirectByRole();
        }
      } catch (err) {
        if (err && /Email not confirmed/i.test(err.message || "")) {
          try { await supabaseClient.auth.resend({ type: "signup", email }); } catch (e) { /* o modal oferece reenviar */ }
          openEmailOtp(email);
        } else {
          showMessage(translateAuthError(err.message), "error");
        }
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Código de 6 dígitos enviado por e-mail (confirmação de cadastro). Só aparece quando o Supabase
    // está com "Confirm email" ligado; sem isso o cadastro entra direto, como antes.
    function openEmailOtp(email) {
      clearMessage();
      AuraOtp.open({
        email,
        length: 6,
        cooldown: 60,
        verify: async (code) => {
          const { error } = await supabaseClient.auth.verifyOtp({ email, token: code, type: "signup" });
          if (error) return { ok: false, message: translateAuthError(error.message) };
          posthog.capture("email_verified");
          return { ok: true };
        },
        resend: async () => {
          const { error } = await supabaseClient.auth.resend({ type: "signup", email });
          return error ? { ok: false, message: translateAuthError(error.message) } : { ok: true };
        },
        onSuccess: () => { redirectByRole({ fresh: true }); },
      });
    }

    function translateAuthError(message) {
      const map = {
        "Invalid login credentials": "E-mail ou senha incorretos.",
        "User already registered": "Já existe uma conta com esse e-mail. Tente entrar.",
        "Password should be at least 6 characters": "A senha precisa ter pelo menos 6 caracteres.",
        "Email not confirmed": "Confirme seu e-mail antes de entrar.",
        "Unable to validate email address: invalid format": "E-mail em formato inválido.",
        "New password should be different": "A nova senha precisa ser diferente da anterior.",
        "Token has expired or is invalid": "Código incorreto ou expirado. Confira e tente de novo.",
        "you can only request this after": "Aguarde um minuto para pedir um novo código.",
        "Auth session missing": "Esse link expirou. Peça um novo em “Esqueci minha senha”.",
        "rate limit": "Muitos pedidos de e-mail seguidos. Aguarde alguns minutos e tente de novo.",
      };
      if (!message) return "Não foi possível concluir. Tente de novo.";
      const known = Object.keys(map).find((k) => message.includes(k));
      return known ? map[known] : message;
    }

    // ===== Esqueci minha senha (início) =====
    const forgotRow = document.getElementById("forgotRow");
    const forgotBtn = document.getElementById("forgotBtn");
    const resetForm = document.getElementById("resetForm");
    toggleModeBtn.addEventListener("click", () => { forgotRow.style.display = mode === "login" ? "" : "none"; });

    forgotBtn.addEventListener("click", async () => {
      clearMessage();
      const email = emailInput.value.trim();
      if (!email) { showMessage("Digite seu e-mail acima e clique de novo em “Esqueci minha senha”.", "error"); emailInput.focus(); return; }
      forgotBtn.disabled = true;
      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: new URL("login.html", location.href).href,
        });
        if (error) throw error;
        posthog.capture("password_reset_requested");
        showMessage("Se esse e-mail tiver uma conta, enviamos um link para criar uma nova senha. Olhe também a caixa de spam.", "success");
      } catch (err) {
        showMessage(translateAuthError(err.message), "error");
      } finally {
        forgotBtn.disabled = false;
      }
    });

    function showRecoveryUI() {
      form.hidden = true;
      resetForm.hidden = false;
      document.getElementById("toggleRow").hidden = true;
      inviteBannerEl.hidden = true;
      formSubtitle.textContent = "Crie uma nova senha";
    }

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();
      const a = document.getElementById("newPassword").value;
      const b = document.getElementById("newPassword2").value;
      if (a !== b) { showMessage("As duas senhas não são iguais.", "error"); return; }
      const btn = document.getElementById("resetBtn");
      btn.disabled = true;
      try {
        await supabaseClient.auth.getSession(); // espera o supabase-js ler o link
        const { error } = await supabaseClient.auth.updateUser({ password: a });
        if (error) throw error;
        posthog.capture("password_reset_completed");
        await redirectByRole();
      } catch (err) {
        showMessage(translateAuthError(err.message), "error");
        btn.disabled = false;
      }
    });
    // ===== Esqueci minha senha (fim) =====

    // ===== Convite de time (início) =====
    const inviteBannerEl = document.getElementById("inviteBanner");
    try {
      const inviteParam = new URLSearchParams(location.search).get("convite");
      if (inviteParam) localStorage.setItem("aurax_invite", inviteParam);
    } catch (e) { /* sem armazenamento */ }
    // O convite só força o cadastro quando a pessoa chegou pelo LINK do convite (?convite=). Se o convite só
    // ficou guardado no navegador de uma visita antiga, o "Entrar" normal continua sendo login (com um aviso).
    const FROM_INVITE_LINK = !!new URLSearchParams(location.search).get("convite");
    async function setupInvite() {
      let tok = null;
      try { tok = localStorage.getItem("aurax_invite"); } catch (e) { /* sem armazenamento */ }
      if (!tok) return null;
      try {
        const { data } = await supabaseClient.rpc("get_invite_info", { p_token: tok });
        const info = Array.isArray(data) ? data[0] : data;
        if (!info) { try { localStorage.removeItem("aurax_invite"); } catch (e) { /* ok */ } return null; } // convite inexistente, cancelado ou já usado: limpa e segue o login normal
        if (!FROM_INVITE_LINK) {
          inviteBannerEl.innerHTML = "";
          inviteBannerEl.append(document.createTextNode(info.manager_name + " convidou " + info.email + " para o time dele. "));
          const b = document.createElement("button"); b.type = "button"; b.textContent = "Criar conta com este convite";
          b.style.cssText = "margin-top:8px;display:block;background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;font:inherit";
          b.addEventListener("click", () => { location.href = "login.html?convite=" + encodeURIComponent(tok); });
          inviteBannerEl.append(b); inviteBannerEl.hidden = false;
          return null;
        }
        inviteBannerEl.textContent = `${info.manager_name} convidou você para o time dele no AuraX. Crie sua conta (ou entre) para participar.`;
        inviteBannerEl.hidden = false;
        inviteActive = true;
        if (mode === "login") toggleModeBtn.click();
        syncRoleInfo();
        emailInput.value = info.email;
        selectedRole = "funcionario";
        roleToggle.style.display = "none";
        const roleLabel = roleToggle.previousElementSibling;
        if (roleLabel) roleLabel.style.display = "none";
        roleHint.style.display = "none";
        return info;
      } catch (e) { /* sem convite válido */ }
      return null;
    }
    // ===== Convite de time (fim) =====

    // Abrindo pelo link de convite, uma sessão antiga de OUTRA conta (ex.: o próprio gestor
    // testando no mesmo navegador) não pode entrar sozinha: encerra e mostra o cadastro.
    (async function init() {
      if (RECOVERY) { showRecoveryUI(); return; }
      if (LINK_ERROR) showMessage("Esse link expirou ou já foi usado. Peça um novo em “Esqueci minha senha”.", "error");
      const info = await setupInvite();
      // Vindo dos botões de plano da landing: já abre o cadastro com o tipo de conta escolhido.
      const cad = new URLSearchParams(location.search).get("cadastro");
      if (!info && (cad === "individual" || cad === "gestor")) {
        if (mode === "login") toggleModeBtn.click();
        const opt = roleToggle.querySelector('[data-role="' + (cad === "gestor" ? "gestor" : "funcionario") + '"]');
        if (opt) opt.click();
      }
      if (info) {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user && (user.email || "").toLowerCase() !== (info.email || "").toLowerCase()) {
          await supabaseClient.auth.signOut();
          return;
        }
      }
      redirectByRole();
    })();
  </script>
</body>
</html>
