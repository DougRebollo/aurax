<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AuraX — Entrar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 1200px 800px at 50% -10%, #1a2338 0%, #0b0c10 55%, #08080a 100%);
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79, 140, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79, 140, 255, 0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 75%);
    mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 75%);
    pointer-events: none;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: linear-gradient(160deg, rgba(79, 140, 255, 0.08), rgba(126, 231, 135, 0.03));
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    padding: 32px 28px;
  }
  .logo {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #eaf2ff, #7ee787 55%, #4f8cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { text-align: center; font-size: 0.82rem; color: #999; margin-bottom: 26px; }
  label { display: block; font-size: 0.78rem; color: #aaa; margin: 14px 0 6px; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: #eee;
    font-size: 0.9rem;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #4f8cff; }
  button.submit {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #4f8cff, #3d6fd6);
    color: white;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .toggle-row { text-align: center; margin-top: 18px; font-size: 0.82rem; color: #999; }
  .toggle-row button {
    background: none;
    border: none;
    color: #7ba9ff;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }
  .message {
    margin-top: 16px;
    font-size: 0.8rem;
    padding: 10px 12px;
    border-radius: 10px;
    display: none;
  }
  .message.error { display: block; background: rgba(229, 83, 61, 0.12); color: #ff8a76; border: 1px solid rgba(229, 83, 61, 0.3); }
  .message.success { display: block; background: rgba(126, 231, 135, 0.1); color: #7ee787; border: 1px solid rgba(126, 231, 135, 0.3); }
  #nameField { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">AuraX</div>
    <div class="subtitle" id="formSubtitle">Entre com sua conta</div>

    <form id="authForm">
      <div id="nameField">
        <label for="nameInput">Nome</label>
        <input type="text" id="nameInput" placeholder="Seu nome" />
      </div>

      <label for="emailInput">E-mail</label>
      <input type="email" id="emailInput" placeholder="voce@empresa.com" required />

      <label for="passwordInput">Senha</label>
      <input type="password" id="passwordInput" placeholder="••••••••" required minlength="6" />

      <button type="submit" class="submit" id="submitBtn">Entrar</button>
    </form>

    <div class="toggle-row">
      <span id="toggleText">Ainda não tem conta?</span>
      <button type="button" id="toggleModeBtn">Criar conta</button>
    </div>

    <div class="message" id="messageBox"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = "https://tpjdogzhwandxwpwafzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LfW7G2Ai3G2_1Uj_MBRCfg_QIztRQNd";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mode = "login"; // ou "signup"

    const form = document.getElementById("authForm");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("nameInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submitBtn");
    const toggleModeBtn = document.getElementById("toggleModeBtn");
    const toggleText = document.getElementById("toggleText");
    const formSubtitle = document.getElementById("formSubtitle");
    const messageBox = document.getElementById("messageBox");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
    }

    function clearMessage() {
      messageBox.className = "message";
      messageBox.textContent = "";
    }

    toggleModeBtn.addEventListener("click", () => {
      mode = mode === "login" ? "signup" : "login";
      clearMessage();
      if (mode === "signup") {
        nameField.style.display = "block";
        submitBtn.textContent = "Criar conta";
        formSubtitle.textContent = "Crie sua conta no AuraX";
        toggleText.textContent = "Já tem conta?";
        toggleModeBtn.textContent = "Entrar";
      } else {
        nameField.style.display = "none";
        submitBtn.textContent = "Entrar";
        formSubtitle.textContent = "Entre com sua conta";
        toggleText.textContent = "Ainda não tem conta?";
        toggleModeBtn.textContent = "Criar conta";
      }
    });

    // Depois de logado, manda cada papel pra tela certa. O painel do gestor
    // ainda está em construção — por enquanto todo mundo cai no app.
    async function redirectByRole() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;
      const { data: profile } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      if (profile && profile.role === "gestor") {
        window.location.href = "index.html"; // painel-gestor.html ainda não existe
      } else {
        window.location.href = "index.html";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();
      submitBtn.disabled = true;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        if (mode === "signup") {
          const name = nameInput.value.trim();
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { name } },
          });
          if (error) throw error;

          if (data.user && !data.session) {
            showMessage("Conta criada! Confirme seu e-mail antes de entrar.", "success");
          } else {
            await redirectByRole();
          }
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          await redirectByRole();
        }
      } catch (err) {
        showMessage(translateAuthError(err.message), "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    function translateAuthError(message) {
      const map = {
        "Invalid login credentials": "E-mail ou senha incorretos.",
        "User already registered": "Já existe uma conta com esse e-mail. Tente entrar.",
        "Password should be at least 6 characters": "A senha precisa ter pelo menos 6 caracteres.",
        "Email not confirmed": "Confirme seu e-mail antes de entrar.",
        "Unable to validate email address: invalid format": "E-mail em formato inválido.",
      };
      if (!message) return "Não foi possível concluir. Tente de novo.";
      const known = Object.keys(map).find((k) => message.includes(k));
      return known ? map[known] : message;
    }

    redirectByRole();
  </script>
</body>
</html>
