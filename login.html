<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AuraX — Entrar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 1200px 800px at 50% -10%, #1a2338 0%, #0b0c10 55%, #08080a 100%);
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79, 140, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79, 140, 255, 0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 75%);
    mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 75%);
    pointer-events: none;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: linear-gradient(160deg, rgba(79, 140, 255, 0.08), rgba(126, 231, 135, 0.03));
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    padding: 32px 28px;
  }
  .logo {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #eaf2ff, #7ee787 55%, #4f8cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { text-align: center; font-size: 0.82rem; color: #999; margin-bottom: 26px; }
  label { display: block; font-size: 0.78rem; color: #aaa; margin: 14px 0 6px; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: #eee;
    font-size: 0.9rem;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #4f8cff; }
  button.submit {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #4f8cff, #3d6fd6);
    color: white;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .toggle-row { text-align: center; margin-top: 18px; font-size: 0.82rem; color: #999; }
  .toggle-row button {
    background: none;
    border: none;
    color: #7ba9ff;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }
  .message {
    margin-top: 16px;
    font-size: 0.8rem;
    padding: 10px 12px;
    border-radius: 10px;
    display: none;
  }
  .message.error { display: block; background: rgba(229, 83, 61, 0.12); color: #ff8a76; border: 1px solid rgba(229, 83, 61, 0.3); }
  .message.success { display: block; background: rgba(126, 231, 135, 0.1); color: #7ee787; border: 1px solid rgba(126, 231, 135, 0.3); }
  #nameField { display: none; }
  .role-toggle { display: flex; gap: 8px; }
  .role-option {
    flex: 1;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: #999;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .role-option.selected { background: rgba(79, 140, 255, 0.18); border-color: #4f8cff; color: #eaf2ff; }
  /* ===== Botão Google (início) ===== */
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 4px; color: #666; font-size: 0.75rem; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
  button.google-btn {
    width: 100%;
    margin-top: 14px;
    padding: 11px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
    background: #fff;
    color: #1f1f1f;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  button.google-btn:hover { background: #f2f2f2; }
  button.google-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  button.google-btn svg { width: 18px; height: 18px; }
  /* ===== Botão Google (fim) ===== */
</style>
<script>
  !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var o="posthog";return"posthog"!==a&&(o+="."+a),t||(o+=" (stub)"),o},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagPayload isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSurveysLoaded onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey getNextSurveyStep identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty createPersonProfile opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
  posthog.init('phc_vyVJ7sTb6kpXhAdzVbWcyBCf4epgvTv7UnnuiPqnFCpm', {
    api_host: 'https://us.i.posthog.com',
    person_profiles: 'identified_only',
  });
</script>
</head>
<body>
  <div class="card">
    <div class="logo">AuraX</div>
    <div class="subtitle" id="formSubtitle">Entre com sua conta</div>

    <form id="authForm">
      <div id="nameField">
        <label for="nameInput">Nome</label>
        <input type="text" id="nameInput" placeholder="Seu nome" />

        <label>Você é gestor ou funcionário?</label>
        <div class="role-toggle" id="roleToggle">
          <button type="button" class="role-option selected" data-role="funcionario">Funcionário</button>
          <button type="button" class="role-option" data-role="gestor">Gestor</button>
        </div>

        <label for="cargoInput">Cargo <span style="color:#666">(opcional)</span></label>
        <input type="text" id="cargoInput" placeholder="Ex: Gerente Comercial" />

        <label for="empresaInput">Empresa <span style="color:#666">(opcional)</span></label>
        <input type="text" id="empresaInput" placeholder="Ex: Registro Rural" />
      </div>

      <label for="emailInput">E-mail</label>
      <input type="email" id="emailInput" placeholder="voce@empresa.com" required />

      <label for="passwordInput">Senha</label>
      <input type="password" id="passwordInput" placeholder="••••••••" required minlength="6" />

      <button type="submit" class="submit" id="submitBtn">Entrar</button>
    </form>

    <!-- ===== Botão Google (início) ===== -->
    <div class="divider">ou</div>
    <button type="button" class="google-btn" id="googleBtn">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Entrar com Google
    </button>
    <!-- ===== Botão Google (fim) ===== -->

    <div class="toggle-row">
      <span id="toggleText">Ainda não tem conta?</span>
      <button type="button" id="toggleModeBtn">Criar conta</button>
    </div>

    <div class="message" id="messageBox"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = "https://tpjdogzhwandxwpwafzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LfW7G2Ai3G2_1Uj_MBRCfg_QIztRQNd";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mode = "login"; // ou "signup"
    let selectedRole = "funcionario";

    const form = document.getElementById("authForm");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("nameInput");
    const roleToggle = document.getElementById("roleToggle");
    const cargoInput = document.getElementById("cargoInput");
    const empresaInput = document.getElementById("empresaInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submitBtn");
    const toggleModeBtn = document.getElementById("toggleModeBtn");
    const toggleText = document.getElementById("toggleText");
    const formSubtitle = document.getElementById("formSubtitle");
    const messageBox = document.getElementById("messageBox");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
    }

    function clearMessage() {
      messageBox.className = "message";
      messageBox.textContent = "";
    }

    roleToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".role-option");
      if (!btn) return;
      roleToggle.querySelectorAll(".role-option").forEach((b) => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedRole = btn.dataset.role;
    });

    toggleModeBtn.addEventListener("click", () => {
      mode = mode === "login" ? "signup" : "login";
      clearMessage();
      if (mode === "signup") {
        nameField.style.display = "block";
        submitBtn.textContent = "Criar conta";
        formSubtitle.textContent = "Crie sua conta no AuraX";
        toggleText.textContent = "Já tem conta?";
        toggleModeBtn.textContent = "Entrar";
      } else {
        nameField.style.display = "none";
        submitBtn.textContent = "Entrar";
        formSubtitle.textContent = "Entre com sua conta";
        toggleText.textContent = "Ainda não tem conta?";
        toggleModeBtn.textContent = "Criar conta";
      }
    });

    // Depois de logado, manda cada papel pra tela certa.
    async function redirectByRole() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;
      const { data: profile } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      // Pagamento pendente bloqueia a conta inteira (gestor e time) — nunca
      // deixa passar pra tela de gravação ou pro painel antes de confirmar.
      const { data: accountStatus } = await supabaseClient.rpc("effective_account_status", { uid: user.id });
      if (accountStatus === "pendente_pagamento") {
        window.location.href = "pagamento-pendente.html";
        return;
      }

      if (profile && profile.role === "gestor") {
        window.location.href = "painel-gestor.html";
      } else {
        window.location.href = "index.html";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();
      submitBtn.disabled = true;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        if (mode === "signup") {
          const name = nameInput.value.trim();
          const cargo = cargoInput.value.trim();
          const empresa = empresaInput.value.trim();
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { name, cargo, empresa, role: selectedRole } },
          });
          if (error) throw error;

          if (data.user && !data.session) {
            posthog.identify(data.user.id, { email });
            posthog.capture("signup_completed", { pending_email_confirmation: true });
            showMessage("Conta criada! Confirme seu e-mail antes de entrar.", "success");
          } else {
            posthog.identify(data.user.id, { email });
            posthog.capture("signup_completed");
            await redirectByRole();
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          posthog.identify(data.user.id, { email });
          posthog.capture("login_completed");
          await redirectByRole();
        }
      } catch (err) {
        showMessage(translateAuthError(err.message), "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    function translateAuthError(message) {
      const map = {
        "Invalid login credentials": "E-mail ou senha incorretos.",
        "User already registered": "Já existe uma conta com esse e-mail. Tente entrar.",
        "Password should be at least 6 characters": "A senha precisa ter pelo menos 6 caracteres.",
        "Email not confirmed": "Confirme seu e-mail antes de entrar.",
        "Unable to validate email address: invalid format": "E-mail em formato inválido.",
      };
      if (!message) return "Não foi possível concluir. Tente de novo.";
      const known = Object.keys(map).find((k) => message.includes(k));
      return known ? map[known] : message;
    }

    // ===== Login com Google (início) =====
    const googleBtn = document.getElementById("googleBtn");
    googleBtn.addEventListener("click", async () => {
      clearMessage();
      googleBtn.disabled = true;
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: "https://dougrebollo.github.io/aurax/login.html",
          },
        });
        if (error) throw error;
        // Se não deu erro, o navegador já está sendo redirecionado pro Google.
      } catch (err) {
        showMessage(translateAuthError(err.message), "error");
        googleBtn.disabled = false;
      }
    });
    // ===== Login com Google (fim) =====

    redirectByRole();
  </script>
</body>
</html>
